[workspace]
resolver = "2"
members = [
    "rail_town",
    "rail_sim",
    "rail_map",
    "rail_net",
]
default-members = ["rail_town"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bevy = { version = "0.18", default-features = false }
bevy_app = "0.18"
bevy_ecs = "0.18"
rand = { version = "0.8", default-features = false, features = ["std_rng"] }
serde = { version = "1", features = ["derive"] }
# Save / load blobs (and, later, neighbour map chunks). 3.0.0 on crates.io is a
# placeholder that fails to compile — stay on the 2.x line.
bincode = { version = "2.0", default-features = false, features = ["std", "serde"] }

# ─ Profiles ────────────────────────────────────────────
#
# `cargo run` is how the game is actually played during development, and an
# unoptimised Bevy is not a playable Bevy: the renderer, the ECS scheduler and
# every `glam` vector operation run without inlining, which measured at roughly
# 36 ms of engine time per frame on an M4 Max with a near-empty world.
#
# Dependencies are optimised hard and our own crates lightly. Dependencies are
# built once and cached, so the compile-time cost is paid on a clean build and
# essentially never again; `opt-level = 1` on our own code keeps incremental
# rebuilds quick while removing the worst of the debug overhead. Debug symbols
# and assertions are untouched, so backtraces and `debug_assert!` still work.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Tests get the same treatment for the same reason: 800 tests that spin up
# headless Bevy apps are dominated by unoptimised engine code.
[profile.test]
opt-level = 1

[profile.test.package."*"]
opt-level = 3
